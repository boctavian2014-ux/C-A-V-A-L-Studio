appId: com.devaieood.cavallo
productName: CAVALLO
copyright: "Copyright (c) 2026 \"Dev AI\" EOOD. All rights reserved."
artifactName: CAVALLO-Setup-${version}.${ext}
directories:
  output: release
  buildResources: installer/assets
files:
  - dist/**
  - assets/**
  - build-icons/**
  - package.json
  - branding/**
  - "!**/*.map"
  - "!**/*.md"
asar: true
asarUnpack:
  # Worker threads cannot execute JS from inside app.asar
  - dist/main/*worker*.js
  # Native terminal module (prebuilds + any build output)
  - node_modules/node-pty/**/*
npmRebuild: false
buildDependenciesFromSource: false
compression: maximum
extraMetadata:
  main: dist/main/electron-main.js
protocols:
  - name: CAVALLO Studio
    schemes:
      - caval
win:
  icon: build-icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # Keep icon/metadata; skip code signing for local unsigned builds
  signAndEditExecutable: true
  signExecutable: false
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CAVALLO
  installerIcon: build-icons/icon.ico
  uninstallerIcon: build-icons/icon.ico
  include: installer/assets/nsis/custom.nsh
mac:
  icon: build-icons/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: installer/config/signing/entitlements.mac.plist
  entitlementsInherit: installer/config/signing/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  icon: build-icons/icon.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
electronUpdaterCompatibility: ">=6.0.0"
