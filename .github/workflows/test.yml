name: Test

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify runtime assets
        run: npm run verify-runtime-assets
      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Upload test metrics
        if: hashFiles('.cicd-metrics.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-metrics
          path: .cicd-metrics.json

  smoke-electron:
    runs-on: ubuntu-latest
    needs: test
    # PR: best-effort on xvfb. Release preflight requires smoke without continue-on-error.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Electron smoke
        run: xvfb-run -a npm run smoke:electron
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-smoke-logs
          path: .cicd-artifacts/electron-smoke-*.txt
          if-no-files-found: ignore
